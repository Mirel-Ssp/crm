# =====================================================================
# CRM 生产部署编排（在 deploy/ 目录执行：./deploy.sh 或 docker compose up -d --build）
# 首次运行先复制 .env.example 为 .env 并填入强密钥（勿提交仓库）
# 拓扑：frontend(nginx:80) 唯一公网入口，同源反代 backend；中间件仅内网可达
# 后端 8080 仅绑定 127.0.0.1（供本机健康检查，不暴露公网）
# Flyway 迁移随启动自动执行（V1~V15）；运行时数据见 volume
# =====================================================================

services:
  postgres:
    image: postgres:16.9
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${CRM_PG_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "${CRM_REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
    restart: unless-stopped

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: crm_minio
      MINIO_ROOT_PASSWORD: ${CRM_MINIO_PASSWORD}
    volumes:
      - miniodata:/data
    restart: unless-stopped

  backend:
    build: ../backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CRM_PG_PASSWORD: ${CRM_PG_PASSWORD}
      CRM_REDIS_PASSWORD: ${CRM_REDIS_PASSWORD}
      CRM_MINIO_PASSWORD: ${CRM_MINIO_PASSWORD}
      # JWT 强密钥（>=32 字节）必须提供，缺失则启动失败（application-prod.yml 无默认值）
      CRM_JWT_SECRET: ${CRM_JWT_SECRET}
      # 允许跨域的前端域名（逗号分隔）；同源网关部署留空即可
      CRM_CORS_ALLOWED_ORIGINS: ${CRM_CORS_ALLOWED_ORIGINS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  frontend:
    build: ../frontend
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:

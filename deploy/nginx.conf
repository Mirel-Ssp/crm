# =====================================================================
# CRM 前端网关（挂载到 nginx 容器 /etc/nginx/conf.d/default.conf）
# 职责：托管前端 dist 静态资源 + 同源反代后端 REST/WS（免跨域）
# =====================================================================

server {
    listen 80;
    server_name _;

    # 附件上传预留（当前无上传业务，预留 20m）
    client_max_body_size 20m;

    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # ---- WebSocket 通知（前端 notifyWs.ts 连同源 /ws/notify?token=） ----
    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- 后端 REST API（同源网关，CRM_CORS_ALLOWED_ORIGINS 可留空） ----
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ---- 带 hash 的静态资源长缓存 ----
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- SPA 路由回退 ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
